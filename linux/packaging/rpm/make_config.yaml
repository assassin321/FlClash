display_name: FlClash

packager: assassin321
packagerEmail: zhiqu@cock.li
license: Other

priority: optional
section: x11
installed_size: 6604
essential: false
icon: ./assets/images/icon.png

keywords:
  - FlClash
  - Clash
  - ClashMeta
  - Proxy

generic_name: FlClash

group: Applications/Internet

startup_notify: true
startup_wm_class: com.appshub.flclash

install: |
  mkdir -p %{buildroot}%{_bindir}
  mkdir -p %{buildroot}%{_datadir}/%{name}
  mkdir -p %{buildroot}%{_datadir}/applications
  mkdir -p %{buildroot}%{_datadir}/pixmaps
  cp -r %{name}/* %{buildroot}%{_datadir}/%{name}
  ln -s ../share/%{name}/%{name} %{buildroot}%{_bindir}/%{name}
  cp -r %{name}.desktop %{buildroot}%{_datadir}/applications
  cp -r %{name}.png %{buildroot}%{_datadir}/pixmaps
  chmod +sx %{buildroot}%{_datadir}/%{name}/FlClashCore
  update-mime-database %{_datadir}/mime &> /dev/null || :

attr: |
  %attr(4755, root, root) %{_datadir}/%{name}/FlClashCore