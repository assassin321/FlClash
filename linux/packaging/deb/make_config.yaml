display_name: FlClash
package_name: FlClash
maintainer:
  name: assassin321
  email: zhiqu@cock.li

priority: optional
section: x11
installed_size: 6604
essential: false
icon: ./assets/images/icon.png

dependencies:
  - libayatana-appindicator3-dev
  - libkeybinder-3.0-dev

keywords:
  - FlClash
  - Clash
  - ClashMeta
  - Mihomo
  - Proxy

generic_name: FlClash

categories:
  - Network

startup_notify: true
startup_wm_class: com.assassin321.flclash

postinstall_scripts:
  - |
    CORE_PATH="/usr/share/FlClash/FlClashCore"
    if [ -f "$CORE_PATH" ]; then
      chown root:root "$CORE_PATH" 2>/dev/null || true
      chmod +sx "$CORE_PATH" 2>/dev/null || true
    fi
postuninstall_scripts:
  - |
    CORE_PATH="/usr/share/FlClash/FlClashCore"
    if [ -f "$CORE_PATH" ]; then
      chmod -s "$CORE_PATH" 2>/dev/null || true
    fi